/* Personagem cartoon: animacao minima (translateY). Se o CSS falhar, o personagem parado continua visivel. */
/* ============ MAROMBA FOFO: o personagem EXECUTA o exercicio ============
   Pump muscular via propriedades geometricas do SVG (r/rx/ry/height) + fill:
   nao dependem de transform-origin, entao funcionam mesmo com articulacoes
   animadas. Articulacoes usam transform-origin em px absolutos do viewBox.
   Se o CSS falhar, o personagem parado continua visivel. */
.toon-bob{animation:toonBob 2.6s ease-in-out infinite}
@keyframes toonBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* ---- pump muscular: musculo incha e fica vermelho no pico ---- */
@keyframes pumpBiceps{0%,100%{r:8px}50%{r:11px;fill:#ff4444}}
@keyframes pumpTriceps{0%,100%{rx:5px;ry:8px}50%{rx:7px;ry:10.5px;fill:#ff4444}}
@keyframes pumpPec{0%,100%{rx:10px;ry:8px}50%{rx:13px;ry:10px;fill:#ff4444}}
@keyframes pumpDelt{0%,100%{r:9px}50%{r:12px;fill:#ff4444}}
@keyframes pumpLat{0%,100%{rx:6px;ry:12px}50%{rx:8.5px;ry:14px;fill:#ff4444}}
@keyframes pumpThigh{0%,100%{rx:9px;ry:12px}50%{rx:12px;ry:15px;fill:#ff4444}}
@keyframes pumpCalf{0%,100%{rx:7.5px;ry:9px}50%{rx:10px;ry:11.5px;fill:#ff4444}}
@keyframes pumpAbs{0%,100%{height:4px}50%{height:6.5px;fill:#ff4444}}

/* ---- ROSCA DIRETA: antebraco dobra, biceps incha ---- */
.ex-curl .forearm-l,.ex-curl .forearm-r{animation:curlFore 1.6s ease-in-out infinite}
.ex-curl .forearm-l{transform-origin:70px 102px}
.ex-curl .forearm-r{transform-origin:130px 102px}
.ex-curl .muscle-biceps{animation:pumpBiceps 1.6s ease-in-out infinite}
@keyframes curlFore{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-115deg)}}
/* ---- ROSCA ALTERNADA: bracos alternam ---- */
.ex-curlalt .forearm-l{transform-origin:70px 102px;animation:curlFore 1.6s ease-in-out infinite}
.ex-curlalt .forearm-r{transform-origin:130px 102px;animation:curlFore 1.6s ease-in-out .8s infinite}
.ex-curlalt .arm-l .muscle-biceps{animation:pumpBiceps 1.6s ease-in-out infinite}
.ex-curlalt .arm-r .muscle-biceps{animation:pumpBiceps 1.6s ease-in-out .8s infinite}

/* ---- SUPINO / CRUCIFIXO / VOADOR / CROSSOVER: empurra p/ cima, peito pulsa ---- */
.ex-press .arm-l{transform-origin:70px 72px;animation:pressL 2s ease-in-out infinite}
.ex-press .arm-r{transform-origin:130px 72px;animation:pressR 2s ease-in-out infinite}
.ex-press .muscle-pec{animation:pumpPec 2s ease-in-out infinite}
@keyframes pressL{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-160deg)}}
@keyframes pressR{0%,100%{transform:rotate(0deg)}50%{transform:rotate(160deg)}}

/* ---- PUXADA / REMADA: puxa p/ baixo, dorsais destacam ---- */
.ex-pull .arm-l{transform-origin:70px 72px;animation:pullL 2s ease-in-out infinite}
.ex-pull .arm-r{transform-origin:130px 72px;animation:pullR 2s ease-in-out infinite}
.ex-pull .muscle-lat{animation:pumpLat 2s ease-in-out infinite}
@keyframes pullL{0%,100%{transform:rotate(-160deg)}50%{transform:rotate(-10deg)}}
@keyframes pullR{0%,100%{transform:rotate(160deg)}50%{transform:rotate(10deg)}}

/* ---- DESENVOLVIMENTO: empurra p/ cima, deltoides incham ---- */
.ex-shpress .arm-l{transform-origin:70px 72px;animation:pressL 1.8s ease-in-out infinite}
.ex-shpress .arm-r{transform-origin:130px 72px;animation:pressR 1.8s ease-in-out infinite}
.ex-shpress .muscle-delt{animation:pumpDelt 1.8s ease-in-out infinite}

/* ---- ELEVACAO LATERAL: bracos abrem p/ o lado, deltoides incham ---- */
.ex-lateral .arm-l{transform-origin:70px 72px;animation:latL 1.8s ease-in-out infinite}
.ex-lateral .arm-r{transform-origin:130px 72px;animation:latR 1.8s ease-in-out infinite}
.ex-lateral .muscle-delt{animation:pumpDelt 1.8s ease-in-out infinite}
@keyframes latL{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-85deg)}}
@keyframes latR{0%,100%{transform:rotate(0deg)}50%{transform:rotate(85deg)}}

/* ---- ENCOLHIMENTO: ombros sobem ---- */
.ex-shrug .torsoG{transform-origin:100px 124px;animation:shrugBody 1.6s ease-in-out infinite}
.ex-shrug .muscle-delt{animation:pumpDelt 1.6s ease-in-out infinite}
@keyframes shrugBody{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}

/* ---- TRICEPS: antebraco estende, triceps incha ---- */
.ex-triceps .forearm-l{transform-origin:70px 102px;animation:triFore 1.7s ease-in-out infinite}
.ex-triceps .forearm-r{transform-origin:130px 102px;animation:triFore 1.7s ease-in-out infinite}
.ex-triceps .muscle-triceps{animation:pumpTriceps 1.7s ease-in-out infinite}
@keyframes triFore{0%,100%{transform:rotate(-85deg)}50%{transform:rotate(-5deg)}}

/* ---- PERNAS (agachamento/leg press/hack/smith/stiff/afundo): dobram, coxas incham ---- */
.ex-squat .torsoG{transform-origin:100px 124px;animation:squatBody 2s ease-in-out infinite}
.ex-squat .thigh-l{transform-origin:88px 124px;animation:squatThighL 2s ease-in-out infinite}
.ex-squat .thigh-r{transform-origin:112px 124px;animation:squatThighR 2s ease-in-out infinite}
.ex-squat .shin-l{transform-box:fill-box;transform-origin:50% 8%;animation:squatShinL 2s ease-in-out infinite}
.ex-squat .shin-r{transform-box:fill-box;transform-origin:50% 8%;animation:squatShinR 2s ease-in-out infinite}
.ex-squat .muscle-thigh{animation:pumpThigh 2s ease-in-out infinite}
@keyframes squatBody{0%,100%{transform:translateY(0)}50%{transform:translateY(15px)}}
@keyframes squatThighL{0%,100%{transform:rotate(0deg)}50%{transform:rotate(13deg)}}
@keyframes squatThighR{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-13deg)}}
@keyframes squatShinL{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-11deg)}}
@keyframes squatShinR{0%,100%{transform:rotate(0deg)}50%{transform:rotate(11deg)}}

/* ---- CADEIRA EXTENSORA: canela estende p/ frente ---- */
.ex-legext .shin-l,.ex-legext .shin-r{transform-box:fill-box;transform-origin:50% 8%;animation:extShin 1.8s ease-in-out infinite}
.ex-legext .muscle-thigh{animation:pumpThigh 1.8s ease-in-out infinite}
@keyframes extShin{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-58deg)}}

/* ---- MESA FLEXORA: calcanhar vai em direcao ao gluteo ---- */
.ex-legcurl .shin-l,.ex-legcurl .shin-r{transform-box:fill-box;transform-origin:50% 8%;animation:legcurlShin 1.8s ease-in-out infinite}
.ex-legcurl .muscle-thigh{animation:pumpThigh 1.8s ease-in-out infinite}
@keyframes legcurlShin{0%,100%{transform:rotate(0deg)}50%{transform:rotate(52deg)}}

/* ---- PANTURRILHA: pes sobem na ponta, panturrilha incha ---- */
.ex-calf .legsG{animation:calfLift 1.6s ease-in-out infinite}
.ex-calf .foot-l{transform-origin:88px 186px;animation:calfFoot 1.6s ease-in-out infinite}
.ex-calf .foot-r{transform-origin:112px 186px;animation:calfFoot 1.6s ease-in-out infinite}
.ex-calf .muscle-calf{animation:pumpCalf 1.6s ease-in-out infinite}
@keyframes calfLift{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes calfFoot{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-26deg)}}

/* ---- ABDOMINAL: tronco curva, abdomen marca ---- */
.ex-abs .torsoG{transform-origin:100px 124px;animation:absCrunch 1.8s ease-in-out infinite}
.ex-abs .muscle-abs{animation:pumpAbs 1.8s ease-in-out infinite}
@keyframes absCrunch{0%,100%{transform:rotate(0deg)}50%{transform:rotate(19deg)}}
